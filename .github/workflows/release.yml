# Publishes a release when a version tag is pushed (release.cmd does that, and
# only after the Build run for that commit passed on all three machines).
# Build already made the installers and signed them for the updater
# (TAURI_SIGNING_PRIVATE_KEY, set up once by more\release-setup.cmd), so nothing is
# built again here: the passed Build run's installers are published as they
# are, with latest.json, which installed copies read to update themselves.
# (Until 0.2.4 tauri-action built everything a second time: ~20 min.)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    name: publish
    steps:
      - uses: actions/checkout@v4

      - name: Installers from the passed Build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId')
          if [ -z "$run" ]; then
            echo "::error::No passed Build run for $GITHUB_SHA. release.cmd waits for one; run Build on this commit first."
            exit 1
          fi
          echo "Build run $run"
          for n in windows macos-apple-silicon macos-intel; do
            for try in 1 2 3; do
              gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "convertino-$n" --dir "in/convertino-$n" && break
              if [ "$try" = 3 ]; then exit 1; fi
              echo "::warning::Download of convertino-$n failed (try $try of 3); trying again"
              rm -rf "in/convertino-$n"; sleep 15
            done
          done
          find in -type f | sort

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/publish-release.py "$GITHUB_REF_NAME" in

  # The published files, downloaded and installed the way people get them.
  verify:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-verify.yml
    with:
      tag: ${{ github.ref_name }}
