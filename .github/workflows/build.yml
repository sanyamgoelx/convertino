# Builds Convertino for Windows and macOS on every push.
# Free for public repositories. Installers appear under the run's "Artifacts".
#
# Mac: one build per processor (Apple silicon, Intel). ImageMagick, Poppler and
# Ghostscript go inside the app (ci/bundle-mac-tools.sh); the other converters
# download on first use. After building, the Mac jobs download those too and
# run the tests with real conversions, so Mac problems show up here.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos-apple-silicon
            os: macos-14
          - name: macos-intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # shared-key: Build and Release use the same compiled dependencies, so a
      # release doesn't start from scratch.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Retina background for the .dmg window
        if: runner.os == 'macOS'
        run: tiffutil -cathidpicheck src-tauri/installer/dmg-background.png src-tauri/installer/dmg-background@2x.png -out src-tauri/installer/dmg-background.tiff

      # The Mac converters only change when Homebrew does: rebuilt once a month
      # (or when the script changes) instead of on every run.
      - name: Month (for the converter cache)
        if: runner.os == 'macOS'
        id: month
        run: echo "m=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cached Mac converters
        if: runner.os == 'macOS'
        id: tools
        uses: actions/cache@v4
        with:
          path: src-tauri/mac-tools
          key: mac-tools-${{ matrix.name }}-${{ hashFiles('ci/bundle-mac-tools.sh') }}-${{ steps.month.outputs.m }}

      - name: Bundle the Mac converters
        if: runner.os == 'macOS' && steps.tools.outputs.cache-hit != 'true'
        run: |
          sw_vers
          bash ci/bundle-mac-tools.sh src-tauri/mac-tools

      - name: Check the bundled converters (Mac)
        if: runner.os == 'macOS'
        run: |
          T="$PWD/src-tauri/mac-tools"
          ls "$T/imagemagick/modules/coders" 2>/dev/null | head -5 || echo "no coder modules"
          export MAGICK_HOME="$T/imagemagick" MAGICK_CONFIGURE_PATH="$T/imagemagick/etc" \
                 MAGICK_CODER_MODULE_PATH="$T/imagemagick/modules/coders" MAGICK_CODER_FILTER_PATH="$T/imagemagick/modules/filters" \
                 FONTCONFIG_FILE="$T/imagemagick/etc/fonts/fonts.conf"
          "$T/imagemagick/magick" -size 64x48 gradient:red-blue /tmp/g.png && echo "magick gradient OK"
          "$T/imagemagick/magick" /tmp/g.png -quality 80 /tmp/g.jpg && "$T/imagemagick/magick" /tmp/g.png /tmp/g.webp && "$T/imagemagick/magick" /tmp/g.png /tmp/g.avif && echo "magick jpg/webp/avif OK"
          "$T/imagemagick/magick" /tmp/g.png /tmp/g.pdf && echo "magick pdf OK"
          "$T/poppler/bin/pdftoppm" -png -r 72 /tmp/g.pdf /tmp/page && ls /tmp/page* && echo "pdftoppm OK"
          # Same data path the app sets (tools.rs, GS_LIB), so this doesn't lean on Homebrew's own Ghostscript.
          GSS="$T/ghostscript/share/ghostscript"; GL=""
          for v in "$GSS" "$GSS"/*; do if [ -d "$v/Resource/Init" ]; then GL="$GL:$v/Resource/Init:$v/lib:$v/Resource/Font:$v/iccprofiles"; fi; done
          export GS_LIB="${GL#:}:$GSS/fonts"
          "$T/ghostscript/bin/gs" -q -dNOPAUSE -dBATCH -sDEVICE=pdfwrite -sOutputFile=/tmp/g2.pdf /tmp/g.pdf && echo "gs OK"

      - name: Build app and installers (Windows)
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CONVERTINO_REPORT_WEBHOOK: ${{ secrets.CONVERTINO_REPORT_WEBHOOK }}
        run: npx tauri build

      - name: Build app and installers (Mac)
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CONVERTINO_REPORT_WEBHOOK: ${{ secrets.CONVERTINO_REPORT_WEBHOOK }}
        run: |
          npx tauri build --bundles app,dmg
          app=$(ls -d src-tauri/target/release/bundle/macos/*.app)
          echo "Converters inside the app:"
          ls "$app/Contents/Resources/tools"
          "$app/Contents/Resources/tools/imagemagick/magick" -version | head -1 || true
          codesign --verify --deep --verbose=2 "$app" || true
          codesign -d --entitlements - "$app" 2>&1 | grep -q automation.apple-events || { echo "Missing apple-events entitlement"; exit 1; }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: convertino-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # ---- Mac checks: real conversions with the bundled converters ----
      # On Apple silicon every time; the Intel Mac (a much slower runner) only
      # checks its bundled converters above, unless the run is started by hand.
      - name: Download the other converters (Mac)
        if: runner.os == 'macOS' && (matrix.name != 'macos-intel' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p src-tauri/tools
          cp -R src-tauri/mac-tools/* src-tauri/tools/
          cd src-tauri
          # One retry: download servers have bad moments, which shouldn't fail the build.
          cargo test --lib install::tests::fetch_tools -- --ignored --nocapture \
            || { echo "Retrying the downloads in 30 s"; sleep 30; cargo test --lib install::tests::fetch_tools -- --ignored --nocapture; }

      - name: Tests with real conversions (Mac)
        if: runner.os == 'macOS' && (matrix.name != 'macos-intel' || github.event_name == 'workflow_dispatch')
        working-directory: src-tauri
        run: cargo test --lib -- --nocapture
