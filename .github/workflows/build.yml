# Builds Convertino for Windows and macOS on every push.
# Free for public repositories. Installers appear under the run's "Artifacts".
#
# Mac: one build per processor (Apple silicon, Intel). ImageMagick, Poppler and
# Ghostscript go inside the app (ci/bundle-mac-tools.sh); the other converters
# download on first use. After building, the Mac jobs download those too and
# run the tests with real conversions, so Mac problems show up here.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos-apple-silicon
            os: macos-14
          - name: macos-intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # shared-key: Build and Release use the same compiled dependencies, so a
      # release doesn't start from scratch.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Retina background for the .dmg window
        if: runner.os == 'macOS'
        run: tiffutil -cathidpicheck src-tauri/installer/dmg-background.png src-tauri/installer/dmg-background@2x.png -out src-tauri/installer/dmg-background.tiff

      # The Mac converters only change when Homebrew does: rebuilt once a month
      # (or when the script changes) instead of on every run.
      - name: Month (for the converter cache)
        if: runner.os == 'macOS'
        id: month
        run: echo "m=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cached Mac converters
        if: runner.os == 'macOS'
        id: tools
        uses: actions/cache@v4
        with:
          path: src-tauri/mac-tools
          key: mac-tools-${{ matrix.name }}-${{ hashFiles('ci/bundle-mac-tools.sh') }}-${{ steps.month.outputs.m }}

      - name: Bundle the Mac converters
        if: runner.os == 'macOS' && steps.tools.outputs.cache-hit != 'true'
        run: |
          sw_vers
          bash ci/bundle-mac-tools.sh src-tauri/mac-tools

      - name: Check the bundled converters (Mac)
        if: runner.os == 'macOS'
        run: |
          T="$PWD/src-tauri/mac-tools"
          ls "$T/imagemagick/modules/coders" 2>/dev/null | head -5 || echo "no coder modules"
          export MAGICK_HOME="$T/imagemagick" MAGICK_CONFIGURE_PATH="$T/imagemagick/etc" \
                 MAGICK_CODER_MODULE_PATH="$T/imagemagick/modules/coders" MAGICK_CODER_FILTER_PATH="$T/imagemagick/modules/filters" \
                 FONTCONFIG_FILE="$T/imagemagick/etc/fonts/fonts.conf"
          "$T/imagemagick/magick" -size 64x48 gradient:red-blue /tmp/g.png && echo "magick gradient OK"
          "$T/imagemagick/magick" /tmp/g.png -quality 80 /tmp/g.jpg && "$T/imagemagick/magick" /tmp/g.png /tmp/g.webp && "$T/imagemagick/magick" /tmp/g.png /tmp/g.avif && echo "magick jpg/webp/avif OK"
          "$T/imagemagick/magick" /tmp/g.png /tmp/g.pdf && echo "magick pdf OK"
          # Camera RAW photos go through LibRaw's dcraw_emu (Homebrew's ImageMagick has no LibRaw).
          { "$T/imagemagick/dcraw_emu" 2>&1 || true; } | grep -q "Usage" || { echo "The bundled dcraw_emu doesn't start"; exit 1; }
          echo "dcraw_emu OK"
          "$T/poppler/bin/pdftoppm" -png -r 72 /tmp/g.pdf /tmp/page && ls /tmp/page* && echo "pdftoppm OK"
          # Same data path the app sets (tools.rs, GS_LIB), so this doesn't lean on Homebrew's own Ghostscript.
          GSS="$T/ghostscript/share/ghostscript"; GL=""
          for v in "$GSS" "$GSS"/*; do if [ -d "$v/Resource/Init" ]; then GL="$GL:$v/Resource/Init:$v/lib:$v/Resource/Font:$v/iccprofiles"; fi; done
          export GS_LIB="${GL#:}:$GSS/fonts"
          "$T/ghostscript/bin/gs" -q -dNOPAUSE -dBATCH -sDEVICE=pdfwrite -sOutputFile=/tmp/g2.pdf /tmp/g.pdf && echo "gs OK"

      # Camera RAW samples for the tests (public domain, checked by SHA-256).
      - name: Cached RAW samples
        uses: actions/cache@v4
        with:
          path: test-files/raw
          key: raw-samples-${{ hashFiles('ci/fetch-raw-samples.sh') }}

      - name: RAW samples
        shell: bash
        run: bash ci/fetch-raw-samples.sh test-files/raw

      # The `convertino` command is a second program in the same crate; built
      # first so the installers always find it next to the app.
      - name: Build the convertino command
        working-directory: src-tauri
        env:
          CONVERTINO_REPORT_WEBHOOK: ${{ secrets.CONVERTINO_REPORT_WEBHOOK }}
        run: cargo build --release --bin convertino-cli

      - name: Build app and installers (Windows)
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CONVERTINO_REPORT_WEBHOOK: ${{ secrets.CONVERTINO_REPORT_WEBHOOK }}
        run: npx tauri build

      # hdiutil (making the .dmg) fails now and then with "Resource busy" on GitHub's
      # Macs while XProtect scans the new image: stop XProtect first.
      - name: Make room for the disk image (Mac)
        if: runner.os == 'macOS'
        run: sudo pkill -9 XProtect >/dev/null 2>&1 || true

      - name: Build app and installers (Mac)
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CONVERTINO_REPORT_WEBHOOK: ${{ secrets.CONVERTINO_REPORT_WEBHOOK }}
        run: |
          # Making the .dmg can still fail at random: try up to 3 times (the app itself is built once).
          for try in 1 2 3; do
            npx tauri build --bundles app,dmg && break
            if [ "$try" = 3 ]; then exit 1; fi
            echo "::warning::Building the Mac installer failed (try $try of 3); trying again"
            sudo pkill -9 XProtect >/dev/null 2>&1 || true
            sleep 15
          done
          app=$(ls -d src-tauri/target/release/bundle/macos/*.app)
          echo "Converters inside the app:"
          ls "$app/Contents/Resources/tools"
          test -x "$app/Contents/MacOS/convertino-cli" || { echo "The convertino command is missing from the app"; exit 1; }
          "$app/Contents/Resources/tools/imagemagick/magick" -version | head -1 || true
          codesign --verify --deep --verbose=2 "$app" || true
          codesign -d --entitlements - "$app" 2>&1 | grep -q automation.apple-events || { echo "Missing apple-events entitlement"; exit 1; }

      # The installers plus the updater files and their signatures: a release
      # publishes exactly these (release.yml), without building again.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: convertino-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      # ---- Mac checks: real conversions with the bundled converters ----
      # On Apple silicon every time; the Intel Mac (a much slower runner) only
      # checks its bundled converters above, unless the run is started by hand.
      # Downloaded converters (FFmpeg, Pandoc, LibreOffice…) kept for a month, so a
      # slow or half-updated download mirror doesn't hold up every run.
      - name: Month (for the downloaded converters)
        id: dmonth
        shell: bash
        run: echo "m=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore downloaded converters
        id: dl-cache
        if: runner.os == 'Windows' || matrix.name != 'macos-intel' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: src-tauri/tools
          key: tools-${{ matrix.name }}-${{ hashFiles('src-tauri/src/install.rs', 'ci/bundle-mac-tools.sh') }}-${{ steps.dmonth.outputs.m }}

      - name: Download the other converters (Mac)
        timeout-minutes: 40
        if: runner.os == 'macOS' && (matrix.name != 'macos-intel' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p src-tauri/tools
          cp -R src-tauri/mac-tools/. src-tauri/tools/
          cd src-tauri
          # One retry: download servers have bad moments, which shouldn't fail the build.
          cargo test --lib install::tests::fetch_tools -- --ignored --nocapture \
            || { echo "Retrying the downloads in 30 s"; sleep 30; cargo test --lib install::tests::fetch_tools -- --ignored --nocapture; }

      - name: Keep the downloaded converters (Mac)
        if: runner.os == 'macOS' && steps.dl-cache.outcome == 'success' && steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src-tauri/tools
          key: tools-${{ matrix.name }}-${{ hashFiles('src-tauri/src/install.rs', 'ci/bundle-mac-tools.sh') }}-${{ steps.dmonth.outputs.m }}

      - name: Tests with real conversions (Mac)
        timeout-minutes: 60
        if: runner.os == 'macOS' && (matrix.name != 'macos-intel' || github.event_name == 'workflow_dispatch')
        working-directory: src-tauri
        run: cargo test -- --nocapture

      # ---- Windows checks: the same tests with real conversions ----
      - name: Download the converters (Windows)
        timeout-minutes: 40
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cargo test --lib install::tests::fetch_tools -- --ignored --nocapture \
            || { echo "Retrying the downloads in 30 s"; sleep 30; cargo test --lib install::tests::fetch_tools -- --ignored --nocapture; }

      - name: Keep the downloaded converters (Windows)
        if: runner.os == 'Windows' && steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src-tauri/tools
          key: tools-${{ matrix.name }}-${{ hashFiles('src-tauri/src/install.rs', 'ci/bundle-mac-tools.sh') }}-${{ steps.dmonth.outputs.m }}

      - name: Tests with real conversions (Windows)
        timeout-minutes: 60
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test -- --nocapture

  # ---- The installers themselves, installed the way a person does ----
  verify-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos-apple-silicon
            os: macos-14
    runs-on: ${{ matrix.os }}
    name: install ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/download-artifact@v4
        with:
          name: convertino-${{ matrix.name }}
          path: dist

      - name: Version
        id: v
        shell: bash
        run: echo "v=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # Upgrade path: the last published release first, then this build over it.
      - name: Previous release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern '*-setup.exe' --dir previous || echo "no previous release"

      - name: Install, use and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Recurse -Filter *-setup.exe | Select-Object -First 1
          $prev = Get-ChildItem previous -Filter *-setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $opts = @{ Installer = $setup.FullName; Version = "${{ steps.v.outputs.v }}" }
          if ($prev) { $opts.Previous = $prev.FullName }
          & ci/verify-install-windows.ps1 @opts

      - name: Install and use (Mac)
        if: runner.os == 'macOS'
        run: bash ci/verify-install-mac.sh "$(find dist -name '*.dmg' | head -1)" "${{ steps.v.outputs.v }}"
