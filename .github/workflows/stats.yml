# Every hour: download counts for each release, written to stats/downloads.json
# on the "stats" branch (one commit, replaced each time, so main stays clean).
# The Convertino Downloads page reads it from there.
#
# Test downloads are taken out (ci/download-stats.py): the ones our own
# Build / Release check jobs make, worked out from GitHub's job records and
# kept in stats/ci-ledger.json, and the ones listed in
# .github/stats-exclude.json (the developer's own copy updating, etc.).
# "raw" next to each release keeps GitHub's own totals.
name: Stats

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/contents/stats/ci-ledger.json?ref=stats" \
            -H "Accept: application/vnd.github.raw" > old-ledger.json 2>/dev/null || echo '{}' > old-ledger.json
          python3 -c "import json; json.load(open('old-ledger.json'))" 2>/dev/null || echo '{}' > old-ledger.json
          python3 ci/download-stats.py --ledger old-ledger.json --exclude .github/stats-exclude.json \
            --out downloads.json --new-ledger ci-ledger.json

      - name: Publish to the stats branch
        run: |
          mkdir out && cd out
          git init -q -b stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir stats && cp ../downloads.json ../ci-ledger.json stats/
          git add stats && git commit -q -m "Download counts"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:stats
