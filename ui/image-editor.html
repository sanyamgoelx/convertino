<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convertino – Edit image</title>
<link rel="stylesheet" href="image-editor.css">
</head>
<body>
<header class="toolbar">
  <div class="group" role="group" aria-label="New crops">
    <span class="glabel">Draw</span>
    <button class="tb" type="button" data-draw="rect" aria-pressed="true" title="Draw rectangles (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12"/></svg><span class="lbl">Rectangle</span></button>
    <button class="tb" type="button" data-draw="quad" aria-pressed="false" title="Draw 4-corner crops for tilted things (Q)"><svg viewBox="0 0 24 24"><path d="M4.5 7L19 4.5 20.5 19 3.5 17z"/></svg><span class="lbl">4 corners</span></button>
  </div>
  <div class="sep"></div>
  <div class="group" role="group" aria-label="Shape">
    <span class="glabel">Shape</span>
    <button class="tb" type="button" data-ratio="free" aria-pressed="true">Free</button>
    <button class="tb" type="button" data-ratio="orig" aria-pressed="false">Original</button>
    <button class="tb" type="button" data-ratio="1" aria-pressed="false">1:1</button>
    <button class="tb" type="button" data-ratio="0.8" aria-pressed="false">4:5</button>
    <button class="tb" type="button" data-ratio="1.7778" aria-pressed="false">16:9</button>
    <button class="tb" type="button" data-ratio="0.5625" aria-pressed="false">9:16</button>
  </div>
  <div class="sep"></div>
  <div class="group" role="group" aria-label="Turn">
    <button class="tb" type="button" id="rotl" title="Turn left" aria-label="Turn left"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7 M3 4v5h5"/></svg></button>
    <button class="tb" type="button" id="rotr" title="Turn right" aria-label="Turn right"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7 M21 4v5h-5"/></svg></button>
    <button class="tb" type="button" id="flip" title="Flip left to right" aria-label="Flip"><svg viewBox="0 0 24 24"><path d="M12 3v18 M9 7L4 17h5z M15 7l5 10h-5z"/></svg></button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button class="tb" type="button" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5 M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="tb" type="button" id="redo" title="Redo (Ctrl+Y)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5 M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  </div>
  <div class="spacer"></div>
  <select id="fmt" aria-label="Save as"></select>
  <button class="primary" type="button" id="save" disabled>Save</button>
</header>

<main>
  <div class="stage" id="stage">
    <div class="frame" id="frame" hidden>
      <canvas id="img"></canvas>
      <canvas class="shade" id="shade"></canvas>
      <svg class="overlay" id="overlay"></svg>
      <canvas class="loupe" id="loupe" width="128" height="128" hidden></canvas>
    </div>
    <div class="loading" id="loading"><div class="spin"></div><span id="loading-text">Opening the picture…</span></div>
    <div class="hint" id="hint" hidden>Drag on the picture to add a crop</div>
  </div>
  <aside class="panel">
    <h2>Crops <span id="count">0</span></h2>
    <div class="list" id="list"></div>
    <div class="fields" id="fields">
      <div class="row"><span class="rl">Crop</span>
        <div class="seg" role="group" aria-label="Crop type">
          <button type="button" data-kind="rect"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12"/></svg>Rectangle</button>
          <button type="button" data-kind="quad"><svg viewBox="0 0 24 24"><path d="M4.5 7L19 4.5 20.5 19 3.5 17z"/></svg>4 corners</button>
        </div>
      </div>
      <div class="row" id="quad-tools"><span class="rl"></span><button class="ghost" type="button" id="square">Square up</button><button class="ghost" type="button" id="edges">Find edges</button></div>
      <div class="row"><label class="rl" for="nm">Name</label><input type="text" id="nm" spellcheck="false"></div>
      <div class="row"><label class="rl" for="w" id="size-lbl">Size</label><input type="number" id="w" min="1"><span class="x">×</span><input type="number" id="h" min="1"></div>
      <div class="row" id="pos-row"><label class="rl" for="px">Position</label><input type="number" id="px" min="0"><span class="x">,</span><input type="number" id="py" min="0"></div>
      <div class="sub" id="quad-note">Drag each pin onto a corner of the thing you want. It's saved straightened out, at the size above.</div>
      <label class="check"><input type="checkbox" id="whole"> Also save the whole picture, turned as shown</label>
    </div>
  </aside>
</main>

<footer class="status"><span id="st-name"></span><span id="st-dims"></span><span class="st-far">Saves next to the original · the original is never changed</span></footer>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="image-editor.js"></script>
</body>
</html>
