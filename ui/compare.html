<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare – Convertino</title>
<link rel="stylesheet" href="compare.css">
</head>
<body>
  <aside class="list" id="list" hidden aria-label="Compressed copies">
    <div class="tabs" id="tabs" role="group" aria-label="Show"></div>
    <div class="rows" id="rows"></div>
  </aside>
  <main class="main" id="main">
    <header class="head">
      <div class="titles">
        <h1 id="name">Compare</h1>
        <span class="by" id="by"></span>
      </div>
      <span class="badge" id="badge" hidden></span>
      <div class="nav" id="nav" hidden>
        <button type="button" class="sq" id="prev" aria-label="Previous pair (K)">‹</button>
        <span id="count"></span>
        <button type="button" class="sq" id="next" aria-label="Next pair (J)">›</button>
      </div>
    </header>
    <p class="save" id="save"></p>
    <div class="facts-wrap"><table class="facts" id="facts"></table></div>
    <p class="flag" id="flag" hidden></p>
    <p class="note warn" id="still-note" hidden></p>
    <div class="bar" id="bar">
      <div class="seg" id="g-mode" role="group" aria-label="View"></div>
      <div class="seg" id="g-zoom" role="group" aria-label="Zoom"></div>
      <div class="seg" id="g-sound" role="group" aria-label="Sound"></div>
      <label class="page" id="page-box" hidden>Page <input type="number" id="page" min="1" value="1"></label>
    </div>
    <div class="stage m-side" id="stage">
      <div class="pane po"><div class="view" id="view-o"></div><span class="label">Original</span></div>
      <div class="pane pc"><div class="view" id="view-c"></div><span class="label">Compressed copy</span></div>
      <div class="handle" id="handle" aria-hidden="true"><i></i></div>
      <p class="status" id="status">Getting both files ready…</p>
    </div>
    <div class="trans" id="trans">
      <button type="button" class="primary" id="play" title="Play / pause (Space)">Play</button>
      <button type="button" id="back1" title="One frame back (←)">◀ frame</button>
      <button type="button" id="fwd1" title="One frame on (→)">frame ▶</button>
      <span class="time" id="time">0:00.00</span>
      <button type="button" id="flip" hidden title="Switch between the two (F)">Showing: copy · flip</button>
      <label class="auto" id="auto-box" hidden><input type="checkbox" id="auto"> Flip by itself</label>
    </div>
    <div class="tl" id="tl">
      <div class="marks" id="marks"></div>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Position">
    </div>
    <p class="keys" id="keys"></p>
    <div class="act" id="act"></div>
  </main>
  <script src="compare.js"></script>
</body>
</html>
