<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convertino – Edit PDF</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header class="toolbar">
  <div class="tabs" role="tablist" aria-label="Edit mode">
    <button type="button" role="tab" id="tab-pages" aria-selected="true">Pages</button>
    <button type="button" role="tab" id="tab-markup" aria-selected="false">Mark up</button>
  </div>
  <div class="sep"></div>

  <div class="group" id="pages-tools">
    <button class="tb" type="button" data-act="rotl" title="Rotate left" aria-label="Rotate left"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7 M3 4v5h5"/></svg></button>
    <button class="tb" type="button" data-act="rotr" title="Rotate right" aria-label="Rotate right"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7 M21 4v5h-5"/></svg></button>
    <button class="tb" type="button" data-act="delete" title="Delete pages (Delete)" aria-label="Delete pages"><svg viewBox="0 0 24 24"><path d="M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13 M10 11v6 M14 11v6"/></svg></button>
    <div class="sep"></div>
    <button class="tb" type="button" data-act="extract" title="Save the selected pages as a new PDF"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z M14 3v4h4 M12 10v7 M9 14l3 3 3-3"/></svg><span class="lbl">Save selected as PDF</span></button>
    <button class="tb" type="button" data-act="add" title="Add pages from another PDF"><svg viewBox="0 0 24 24"><path d="M12 5v14 M5 12h14"/></svg><span class="lbl">Add pages from a PDF…</span></button>
    <button class="tb" type="button" data-act="selall"><span id="selall-label">Select all</span></button>
  </div>

  <div class="group" id="markup-tools" hidden>
    <button class="tb" type="button" data-tool="select" title="Select and move (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z"/></svg><span class="lbl">Select</span></button>
    <button class="tb" type="button" data-tool="text" title="Add text (T)"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2 M12 4v16 M9 20h6"/></svg><span class="lbl">Text</span></button>
    <button class="tb" type="button" data-tool="highlight" title="Highlight (H)"><svg viewBox="0 0 24 24"><path d="M15 5l4 4-9 9H6v-4z M4 21h16"/></svg><span class="lbl">Highlight</span></button>
    <button class="tb" type="button" data-tool="draw" title="Draw (D)"><svg viewBox="0 0 24 24"><path d="M3 17c3-6 6 2 9-4s5-6 9-3"/></svg><span class="lbl">Draw</span></button>
    <button class="tb" type="button" data-tool="sign" title="Sign"><svg viewBox="0 0 24 24"><path d="M3 16c2-4 4-8 6-8s-1 9 2 9 3-5 5-5 1 3 3 3 M3 21h18"/></svg><span class="lbl">Sign</span></button>
    <button class="tb" type="button" data-tool="image" title="Add a picture"><svg viewBox="0 0 24 24"><path d="M6 5h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z M4 16l5-5 4 4 3-3 4 4 M14.1 9a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0-2.8 0"/></svg><span class="lbl">Picture</span></button>
    <div class="sep"></div>
    <div class="group" id="swatches" role="group" aria-label="Colour"></div>
  </div>

  <div class="spacer"></div>
  <button class="tb" type="button" data-act="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5 M4 9h10a6 6 0 010 12h-3"/></svg></button>
  <button class="tb" type="button" data-act="redo" title="Redo (Ctrl+Y)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5 M20 9H10a6 6 0 000 12h3"/></svg></button>
  <button class="primary" type="button" data-act="save" title="Save a copy next to the original (Ctrl+S)">Save copy</button>
</header>

<main id="main">
  <section class="pages-view" id="pages-view"><div class="grid" id="grid"></div></section>
  <section class="markup-view" id="markup-view" hidden>
    <nav class="rail" id="rail" aria-label="Pages"></nav>
    <div class="stage" id="stage">
      <div class="sheet" id="sheet">
        <canvas id="page-canvas"></canvas>
        <svg class="layer" id="ink-layer" aria-hidden="true"></svg>
        <div class="layer" id="marks"></div>
        <div class="layer" id="fields" style="pointer-events: none"></div>
      </div>
    </div>
  </section>

  <div class="dialog" id="sig-dialog" role="dialog" aria-label="Your signature" hidden>
    <h2>Your signature</h2>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="sig-tab-type" aria-selected="true">Type</button>
      <button type="button" role="tab" id="sig-tab-draw" aria-selected="false">Draw</button>
    </div>
    <div id="sig-type">
      <label><span>Type your name</span><input type="text" id="sig-name" placeholder="Your name" autocomplete="name"></label>
      <div class="sig-preview empty" id="sig-preview" style="margin-top: 12px">Your name</div>
    </div>
    <div id="sig-draw" hidden>
      <canvas class="sig-pad" id="sig-pad" width="652" height="240" aria-label="Draw your signature"></canvas>
      <div class="row" style="justify-content: flex-start; margin-top: 6px"><button type="button" class="linkish" id="sig-clear">Clear</button></div>
    </div>
    <div class="note">Kept on this computer so you can sign the next PDF in one click.</div>
    <div class="row">
      <button type="button" class="btn" id="sig-cancel">Cancel</button>
      <button type="button" class="primary" id="sig-place" disabled>Place on page</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden><svg class="ic" viewBox="0 0 24 24"><path id="toast-icon" d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="toast-text"></span></div>
  <div class="loading" id="loading"><span id="loading-text">Opening…</span><button type="button" class="btn" id="open-demo" hidden>Open a PDF…</button></div>
</main>

<footer class="status"><span id="status-left"></span><span id="status-right"></span></footer>
<input type="file" id="add-file" accept="application/pdf,.pdf" hidden>
<input type="file" id="image-file" accept="image/png,image/jpeg,.png,.jpg,.jpeg" hidden>
<input type="file" id="demo-file" accept="application/pdf,.pdf" hidden>

<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/fontkit.umd.min.js"></script>
<script type="module" src="editor.js"></script>
</body>
</html>
