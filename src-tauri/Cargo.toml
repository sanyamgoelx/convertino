[package]
name = "convertino"
version = "0.2.1"
description = "Convert any file from a radial wheel in Explorer or Finder"
authors = ["Crofty"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.89"
default-run = "convertino"

[lib]
name = "convertino_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
trash = "5"
# Camera RAW photos: metadata, the picture the camera stored inside, and a
# fallback developer when ImageMagick can't read a file (LGPL-2.1).
rawler = "0.8"
# EXIF into pictures made from RAW photos.
little_exif = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }
# Ctrl+C in the command line stops the converters it started.
ctrlc = "3"
csv = "1"
serde_norway = "0.9"
quick-xml = "0.42"
rust_xlsxwriter = "0.99"
# How alike two pictures look (pictures and PDF Compress pick the smallest file that still looks the same).
ssimulacra2 = "0.5"
# Lossless PNG optimisation.
oxipng = { version = "10", default-features = false, features = ["parallel"] }
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Ole",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

# The picture comparison is slow unoptimised; tests and dev builds use it too.
[profile.dev.package.ssimulacra2]
opt-level = 3
[profile.dev.package.yuvxyb]
opt-level = 3
[profile.dev.package.oxipng]
opt-level = 3
[profile.dev.package.libdeflater]
opt-level = 3

[profile.release]
# Thin LTO: nearly the same size and speed as full LTO, but links in parallel,
# which cuts CI builds (the Intel Mac most) by several minutes.
lto = "thin"
opt-level = "s"
strip = true
